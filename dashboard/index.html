<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>車種DB 育成ダッシュボード</title>
  <style>
    :root{color-scheme:light dark;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#dfe4ec;--accent:#2563eb;--ok:#16a34a;--warn:#d97706;--danger:#dc2626}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
    main{max-width:1120px;margin:auto;padding:28px 18px 48px}.head{display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap}.head h1{margin:0;font-size:clamp(24px,4vw,38px)}.sub{color:var(--muted);font-size:14px}.status{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:var(--warn)}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.metric .label{color:var(--muted);font-size:13px}.metric .value{font-size:34px;font-weight:750;margin-top:4px}.metric .unit{font-size:14px;color:var(--muted);margin-left:4px}.wide{grid-column:span 2}.section{margin-top:14px}.section h2{font-size:18px;margin:0 0 14px}.bar{height:16px;border-radius:999px;background:#e7ebf2;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,#2563eb,#16a34a);width:0;transition:width .5s ease}.barrow{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:13px;color:var(--muted)}
    .fields{display:grid;gap:10px}.field{display:grid;grid-template-columns:120px 1fr 80px;gap:12px;align-items:center;font-size:14px}.mini{height:10px;border-radius:999px;background:#e7ebf2;overflow:hidden}.mini>div{height:100%;background:#2563eb}.pct{text-align:right;font-variant-numeric:tabular-nums}
    table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--muted);font-weight:600}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;background:#eef2ff;color:#3730a3}.bad{background:#fff7ed;color:#9a3412}.good{background:#ecfdf5;color:#166534}.foot{margin-top:18px;color:var(--muted);font-size:12px}.error{padding:14px;border-radius:14px;background:#fff1f2;color:#9f1239;border:1px solid #fecdd3;margin-top:18px;display:none}
    @media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.wide{grid-column:span 2}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wide{grid-column:span 1}.field{grid-template-columns:92px 1fr 58px}.metric .value{font-size:30px}}
    @media(prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#171e2b;--text:#e7edf7;--muted:#9aa6b6;--line:#2a3444}.bar,.mini{background:#273244}.badge{background:#232b55;color:#c7d2fe}.bad{background:#4a2a16;color:#fed7aa}.good{background:#173b2a;color:#bbf7d0}.error{background:#451a1f;color:#fecdd3;border-color:#7f1d1d}}
  </style>
</head>
<body>
<main>
  <div class="head">
    <div><h1>車種DB 育成ダッシュボード</h1><div class="sub">GitHub main の実データをブラウザで直接集計</div></div>
    <div class="status"><span id="dot" class="dot"></span><span id="loadStatus">読み込み中…</span></div>
  </div>

  <div id="error" class="error"></div>

  <section class="grid">
    <div class="card metric"><div class="label">検索マスター</div><div><span id="searchCount" class="value">—</span><span class="unit">件</span></div></div>
    <div class="card metric"><div class="label">適合レコード</div><div><span id="fitmentCount" class="value">—</span><span class="unit">件</span></div></div>
    <div class="card metric"><div class="label">PCD確認済み</div><div><span id="pcdOk" class="value">—</span><span class="unit">件</span></div></div>
    <div class="card metric"><div class="label">PCD不足</div><div><span id="pcdMissing" class="value">—</span><span class="unit">件</span></div></div>

    <div class="card wide section">
      <h2>PCD充足率</h2>
      <div class="bar"><div id="pcdBar"></div></div>
      <div class="barrow"><span id="pcdDetail">—</span><strong id="pcdPct">—</strong></div>
    </div>

    <div class="card wide section">
      <h2>主要項目の充足率</h2>
      <div class="fields" id="fields"></div>
    </div>

    <div class="card wide section">
      <h2>PCD不足車種</h2>
      <div style="overflow:auto"><table><thead><tr><th>メーカー</th><th>車種</th><th>世代</th><th>状態</th></tr></thead><tbody id="missingRows"></tbody></table></div>
    </div>

    <div class="card wide section">
      <h2>育成フェーズ</h2>
      <table><tbody>
        <tr><td><span class="badge good">① 集中</span></td><td>2日間</td><td>既存適合レコードのPCD欠損を最優先</td></tr>
        <tr><td><span class="badge">② 拡大</span></td><td>14日間</td><td>検索マスター全体へPCD調査を拡大</td></tr>
        <tr><td><span class="badge">③ 維持</span></td><td>週1回</td><td>新車・モデルチェンジ・未解決を追跡</td></tr>
      </tbody></table>
    </div>
  </section>
  <div class="foot">最終表示更新: <span id="updated">—</span> ／ 数値はブラウザ表示時点の GitHub Pages 上のJSONから再計算します。</div>
</main>
<script>
(async()=>{
  const $=id=>document.getElementById(id);
  const paths={search:'../app/data/jp_vehicle_search_master_2000_2026_v1.json',fitment:'../app/data/vehicles_2012_2026.json'};
  try{
    const [sRes,fRes]=await Promise.all([fetch(paths.search,{cache:'no-store'}),fetch(paths.fitment,{cache:'no-store'})]);
    if(!sRes.ok||!fRes.ok) throw new Error('JSONの取得に失敗しました');
    const [search,fitment]=await Promise.all([sRes.json(),fRes.json()]);
    const searchRows=search.records||search.vehicles||search.data||[];
    const rows=fitment.vehicles||fitment.records||fitment.data||[];
    const total=rows.length;
    const has=v=>v!==null&&v!==undefined&&v!=='';
    const count=fn=>rows.filter(fn).length;
    const pcd=count(r=>has(r.pcd));
    const missing=rows.filter(r=>!has(r.pcd));
    $('searchCount').textContent=searchRows.length||search.record_count||'—';
    $('fitmentCount').textContent=total||fitment.record_count||'—';
    $('pcdOk').textContent=pcd;
    $('pcdMissing').textContent=missing.length;
    const pct=total?pcd/total*100:0;
    $('pcdPct').textContent=pct.toFixed(1)+'%';
    $('pcdDetail').textContent=`${pcd} / ${total} 件`;
    $('pcdBar').style.width=Math.max(0,Math.min(100,pct))+'%';

    const metrics=[
      ['PCD',r=>has(r.pcd)],['穴数',r=>has(r.holes)],['ハブ径',r=>has(r.hub_bore)],
      ['締結情報',r=>has(r.fastener)],['純正インチ',r=>has(r.oem_inch)],['純正タイヤ',r=>has(r.oem_tire)]
    ];
    $('fields').innerHTML=metrics.map(([label,fn])=>{const n=count(fn),p=total?n/total*100:0;return `<div class="field"><span>${label}</span><div class="mini"><div style="width:${p.toFixed(1)}%"></div></div><span class="pct">${p.toFixed(1)}%</span></div>`}).join('');

    $('missingRows').innerHTML=missing.length?missing.slice(0,40).map(r=>`<tr><td>${esc(r.maker||'—')}</td><td>${esc(r.model||'—')}</td><td>${esc(r.generation||'—')}</td><td><span class="badge bad">要調査</span></td></tr>`).join(''):`<tr><td colspan="4"><span class="badge good">PCD 100% 達成</span></td></tr>`;
    $('loadStatus').textContent='実データ反映中';$('dot').style.background='var(--ok)';
    $('updated').textContent=new Date().toLocaleString('ja-JP');
  }catch(e){$('error').style.display='block';$('error').textContent='ダッシュボードの読み込みエラー: '+e.message;$('loadStatus').textContent='読み込み失敗';$('dot').style.background='var(--danger)';}
  function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
})();
</script>
</body>
</html>
