name: 車種DB育成 v1.7 狙って取り切る自動運転

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/data/**'
      - 'dashboard/**'
      - 'tools/vehicle_db_health.py'
      - 'tools/build_missing_data_queue.py'
      - 'tools/build_research_candidates.py'
      - 'tools/tavily_vehicle_research.py'
      - 'tools/brave_vehicle_research.py'
      - 'tools/gemini_vehicle_extract.py'
      - 'tools/apply_auto_confirmed_pcd.py'
      - 'tools/build_api_run_status.py'
      - 'tools/evaluate_vehicle_evidence.py'
      - 'tests/vehicle_db_qa.py'
      - '.github/workflows/vehicle-db-health.yml'
  push:
    branches: [main]
    paths:
      - 'app/data/**'
      - 'dashboard/**'
      - 'tools/vehicle_db_health.py'
      - 'tools/build_missing_data_queue.py'
      - 'tools/build_research_candidates.py'
      - 'tools/tavily_vehicle_research.py'
      - 'tools/brave_vehicle_research.py'
      - 'tools/gemini_vehicle_extract.py'
      - 'tools/apply_auto_confirmed_pcd.py'
      - 'tools/build_api_run_status.py'
      - 'tools/evaluate_vehicle_evidence.py'
      - 'tests/vehicle_db_qa.py'
      - '.github/workflows/vehicle-db-health.yml'
  schedule:
    - cron: '15 22 * * *'

permissions:
  contents: write

concurrency:
  group: vehicle-db-autopilot
  cancel-in-progress: false

jobs:
  grow-and-check:
    if: ${{ github.actor != 'github-actions[bot]' }}
    name: 1ソース済み優先＋車種別適合ページ集中探索
    runs-on: ubuntu-latest
    steps:
      - name: データ取得
        uses: actions/checkout@v4
      - name: Python準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 事前QAチェック
        run: python tests/vehicle_db_qa.py
      - name: DB健全性・世代境界チェック
        run: python tools/vehicle_db_health.py
      - name: 欠損・世代確認キュー作成
        run: python tools/build_missing_data_queue.py
      - name: 調査候補作成
        run: python tools/build_research_candidates.py
      - name: 第1探索 Tavily（広域発見）
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TAVILY_MAX_QUERIES: '12'
        run: python tools/tavily_vehicle_research.py
      - name: 第2探索 Brave（1ソース済み・別公式ドメイン集中）
        if: ${{ github.event_name != 'pull_request' }}
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          BRAVE_MAX_QUERIES: '12'
        run: python tools/brave_vehicle_research.py
      - name: Gemini（車種別適合ページ優先・複数項目回収）
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-3.5-flash-lite'
          GEMINI_MAX_URLS: '8'
        run: python tools/gemini_vehicle_extract.py
      - name: PCD自動確定反映（2独立公式一致のみ）
        if: ${{ github.event_name != 'pull_request' }}
        run: python tools/apply_auto_confirmed_pcd.py
      - name: 反映後QAチェック
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          python tests/vehicle_db_qa.py
          python tools/vehicle_db_health.py
      - name: 証拠データ評価
        run: python tools/evaluate_vehicle_evidence.py
      - name: API稼働状況スナップショット作成
        if: ${{ always() && github.event_name != 'pull_request' }}
        run: python tools/build_api_run_status.py
      - name: 結果サマリー作成
        if: ${{ always() }}
        run: |
          if [ -f reports/vehicle-db-health.md ]; then cat reports/vehicle-db-health.md >> "$GITHUB_STEP_SUMMARY"; fi
          for f in missing-data-queue research-candidates tavily-search-results brave-search-results gemini-structured-extraction; do
            if [ -f "reports/$f.md" ]; then
              printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
              cat "reports/$f.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ -f reports/auto-pcd-apply.json ]; then
            printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('reports/auto-pcd-apply.json', encoding='utf-8'))
          print('# PCD自動反映')
          print()
          print(f"- 本番反映: {d['applied_count']}件")
          print(f"- 安全条件でスキップ: {d['skipped_count']}件")
          PY
          fi
          if [ -f reports/evidence-evaluation.json ]; then
            printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('reports/evidence-evaluation.json', encoding='utf-8'))
          print('# 証拠データ評価')
          print()
          print(f"- 自動確定候補: {d['accepted_count']}")
          print(f"- 人による確認: {d['review_count']}")
          print(f"- 追加根拠待ち: {d['pending_count']}")
          print(f"- 無効データ: {d['invalid_count']}")
          PY
          fi
      - name: 自動調査結果・確定PCD・構造化候補・API状況を保存
        if: ${{ always() && github.event_name != 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/data/vehicle-updates/auto-research-candidates.json \
            app/data/vehicle-updates/auto-confirmed-pcd.json \
            app/data/vehicle-updates/auto-structured-evidence.json \
            app/data/vehicle-updates/change_log.json \
            app/data/vehicles_2012_2026.json \
            dashboard/api-status.json
          if git diff --cached --quiet; then
            echo "保存対象の変更なし"
          else
            git commit -m "chore: persist automated vehicle research [skip ci]"
            git push
          fi
      - name: レポート保存
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-db-growth-report
          path: |
            reports/vehicle-db-health.json
            reports/vehicle-db-health.md
            reports/missing-data-queue.json
            reports/missing-data-queue.md
            reports/research-candidates.json
            reports/research-candidates.md
            reports/tavily-search-results.json
            reports/tavily-search-results.md
            reports/brave-search-results.json
            reports/brave-search-results.md
            reports/gemini-structured-extraction.json
            reports/gemini-structured-extraction.md
            reports/auto-pcd-apply.json
            reports/evidence-evaluation.json
            reports/review-queue.json
            reports/change-plan.json
            dashboard/api-status.json
          if-no-files-found: warn
          retention-days: 30
