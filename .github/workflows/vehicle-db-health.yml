name: Vehicle DB Health

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/data/**'
      - 'tools/vehicle_db_health.py'
      - 'tools/build_missing_data_queue.py'
      - '.github/workflows/vehicle-db-health.yml'
  push:
    branches: [main]
    paths:
      - 'app/data/**'
      - 'tools/vehicle_db_health.py'
      - 'tools/build_missing_data_queue.py'
  schedule:
    - cron: '15 22 * * 0'

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run vehicle DB health check
        run: python tools/vehicle_db_health.py

      - name: Build missing data queue
        run: python tools/build_missing_data_queue.py

      - name: Add reports to job summary
        run: |
          cat reports/vehicle-db-health.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat reports/missing-data-queue.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DB reports
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-db-health-report
          path: |
            reports/vehicle-db-health.json
            reports/vehicle-db-health.md
            reports/missing-data-queue.json
            reports/missing-data-queue.md
          retention-days: 30
