<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VehicleFitment browser tests</title>
  <style>
    body { max-width: 900px; margin: 32px auto; padding: 0 20px; font: 16px/1.6 system-ui, sans-serif; }
    .pass { color: #176b3a; } .fail { color: #b42318; } pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>VehicleFitment browser tests</h1>
  <p>HTTPサーバー経由で開くと車両DBを読み込み、自動実行します。</p>
  <pre id="results">実行中…</pre>
  <script src="../js/vehicle-fitment-v170.js?v=20260831-fix-empty-number"></script>
  <script>
    (async () => {
      const output = document.querySelector("#results");
      const lines = [];
      let failures = 0;
      const assert = (condition, message) => {
        lines.push(`${condition ? "PASS" : "FAIL"} ${message}`);
        if (!condition) failures += 1;
      };
      try {
        const response = await fetch("../data/vehicles_2012_2026.json");
        if (!response.ok) throw new Error(`車両DB HTTP ${response.status}`);
        const payload = await response.json();
        const vehicles = VehicleFitment.normalizeVehicleDatabase(payload);

        assert(vehicles.length === payload.record_count && vehicles.length === 152, "車両DBを152件読み込める");
        assert(VehicleFitment.validateVehicles(payload).valid, "車両DBスキーマとタイヤサイズを検証できる");
        assert(new Set(vehicles.map(v => v.vehicle_id)).size === vehicles.length, "vehicle_idが一意");
        const qaModels = ["N-BOX", "スペーシア", "タント", "セレナ", "ノア", "シエンタ", "CX-5", "フォレスター"];
        qaModels.forEach(name => {
          assert(vehicles.some(v => v.model.includes(name)), `${name}が存在する`);
        });
        ["プリウス", "アルファードG", "フィット", "ストリーム", "アコード", "エリシオン", "インサイト", "レジェンド", "LS"].forEach(name => {
          assert(vehicles.some(v => v.model === name && Number(v.year_from.slice(0, 4)) <= 2006), `${name}の旧型データが存在する`);
        });
        ["ヤリスクロス", "カローラクロス", "ランドクルーザー300", "ランドクルーザー70", "bZ4X", "シビック", "ZR-V", "キックス", "ジムニーシエラ", "CX-60", "CX-80", "CX-9", "BRZ"].forEach(name => {
          const vehicle = vehicles.find(v => v.model === name);
          assert(Boolean(vehicle), `${name}を追加DBから検索できる`);
          const matchingWheel = vehicle && { pcd: vehicle.pcd, holes: vehicle.holes, inch: vehicle.oem_inches[0], hub_bore: vehicle.hub_bore, fastener: vehicle.fastener };
          assert(vehicle && VehicleFitment.evaluateWheel(vehicle, matchingWheel).status === "candidate", `${name}の基本条件一致を候補判定できる`);
        });
        qaModels.forEach(name => {
          const vehicle = vehicles.find(v => v.model.includes(name));
          const matchingWheel = { pcd: vehicle.pcd, holes: vehicle.holes, inch: vehicle.oem_inches[0], hub_bore: vehicle.hub_bore, fastener: vehicle.fastener };
          assert(VehicleFitment.evaluateWheel(vehicle, matchingWheel).status === "candidate", `${name}の5基本条件一致を候補判定できる`);
          assert(VehicleFitment.evaluateWheel(vehicle, { ...matchingWheel, pcd: vehicle.pcd === 100 ? 114.3 : 100 }).status === "excluded", `${name}のPCD違いを除外できる`);
        });

        const sj = vehicles.find(v => v.vehicle_id === "SUB_FORESTER_SJ");
        const sk = vehicles.find(v => v.vehicle_id === "SUB_FORESTER_SK");
        assert(sj?.pcd === 100 && sk?.pcd === 114.3, "フォレスターSJとSKのPCD差を保持する");
        const skWheel = { pcd: 114.3, holes: 5, inch: 17, hub_bore: sk.hub_bore, fastener: sk.fastener };
        assert(VehicleFitment.evaluateWheel(sk, skWheel).status === "candidate", "SK用5/114.3はSKの候補になる");
        assert(VehicleFitment.evaluateWheel(sj, skWheel).status === "excluded", "SK用5/114.3はSJから除外される");

        assert(VehicleFitment.evaluateWheel(sk, { pcd: 114.3, holes: 5, inch: 17 }).status === "review", "ハブ径・取付規格欠落は要確認");
        assert(VehicleFitment.evaluateWheel(sk, { ...skWheel, holes: 4 }).status === "excluded", "穴数不一致は除外");
        assert(VehicleFitment.evaluateWheel(sk, { ...skWheel, inch: 16 }).status === "excluded", "純正インチ外は除外");

        const updated = VehicleFitment.upsertVehicles(vehicles, [{ ...sk, confidence: "A", model: "フォレスター更新テスト" }]);
        assert(updated.length === vehicles.length, "upsertで既存vehicle_idを重複追加しない");
        assert(updated.find(v => v.vehicle_id === sk.vehicle_id)?.model === "フォレスター更新テスト", "upsertで既存車両を更新できる");

        const golden = await (await fetch("vehicle-golden-v190.json")).json();
        golden.records.forEach(expected => {
          const actual = vehicles.find(item => item.vehicle_id === expected.vehicle_id);
          assert(Boolean(actual), `ゴールデン ${expected.vehicle_id} が存在する`);
          Object.entries(expected).filter(([key]) => key !== "vehicle_id").forEach(([key, value]) => assert(JSON.stringify(actual?.[key]) === JSON.stringify(value), `ゴールデン ${expected.vehicle_id}.${key} が基準値と一致`));
        });
        const lexusVehicles = vehicles.filter(v => v.maker === "レクサス");
        assert(lexusVehicles.length >= 10, "レクサスを10世代以上収録");
        assert(lexusVehicles.filter(vehicle => vehicle.pcd != null && vehicle.holes != null && vehicle.hub_bore != null && vehicle.oem_inches.length && vehicle.oem_tires.length && vehicle.fastener_type).length >= 9, "レクサス9世代は基本判定データが揃う");
        assert(lexusVehicles.filter(vehicle => vehicle.pcd == null || vehicle.holes == null || vehicle.hub_bore == null).every(vehicle => vehicle.confidence === "C"), "基本条件未確認のレクサスは信頼度Cで明示する");
        const nbox = vehicles.find(v => v.vehicle_id === "HON_NBOX_JF3");
        const hondaTaper = VehicleFitment.evaluateWheel(nbox, { pcd: 100, holes: 4, inch: 14, hub_bore: 56, fastener: "M12×P1.5", seat_type: "taper" });
        assert(hondaTaper.status === "review" && hondaTaper.reasons.some(reason => reason.includes("テーパーナット")), "Honda球面座と社外テーパー座は専用ナット要確認");
        const alphard40 = vehicles.find(v => v.vehicle_id === "TOY_ALV_40");
        assert(VehicleFitment.evaluateWheel(alphard40, { pcd: 120, holes: 5, inch: 18, hub_bore: 60, fastener_type: "nut", thread_diameter: "M14", pitch: 1.5 }).status === "excluded", "ボルト車へナット方式を混在させない");
        assert(VehicleFitment.evaluateWheel(sk, { ...skWheel, hub_bore: 55 }).status === "excluded", "車両ハブ径未満は除外");
        const ranged = VehicleFitment.normalizeVehicle({ ...sk, rim_width_min: 7, rim_width_max: 8, offset_min: 40, offset_max: 55 });
        const rangeReview = VehicleFitment.evaluateWheel(ranged, { ...skWheel, sizeText: "17×8.5J", insetText: "60" });
        assert(rangeReview.status === "review" && rangeReview.reasons.some(reason => reason.includes("リム幅")), "リム幅・インセット範囲外は要確認");
        const realWheelQaIds = ["HON_NBOX_JF3", "HON_FREED_GB5", "TOY_PRIUS_60", "TOY_ALV_40", "NIS_XTRAIL_T32", "MAZ_CX5_KF", "SUB_FORESTER_SK", "SUZ_JIMNY_JB64", "LEX_NX_AZ20", "LEX_RX_AL30"];
        realWheelQaIds.forEach(id => {
          const vehicle = vehicles.find(item => item.vehicle_id === id);
          const wheel = { pcd: vehicle.pcd, holes: vehicle.holes, inch: vehicle.oem_inches[0], hub_bore: vehicle.hub_bore, fastener: vehicle.fastener, fastener_type: vehicle.fastener_type, thread_diameter: vehicle.thread_diameter, pitch: vehicle.pitch, seat_type: vehicle.seat_type };
          assert(VehicleFitment.evaluateWheel(vehicle, wheel).status !== "excluded", `実アルミQA ${id}: 基本条件一致は除外しない`);
          assert(VehicleFitment.evaluateWheel(vehicle, { ...wheel, pcd: vehicle.pcd === 100 ? 114.3 : 100 }).status === "excluded", `実アルミQA ${id}: PCD違いを除外`);
          assert(VehicleFitment.evaluateWheel(vehicle, { ...wheel, holes: vehicle.holes === 4 ? 5 : 4 }).status === "excluded", `実アルミQA ${id}: 穴数違いを除外`);
          assert(VehicleFitment.evaluateWheel(vehicle, { ...wheel, hub_bore: vehicle.hub_bore - 1 }).status === "excluded", `実アルミQA ${id}: ハブ径不足を除外`);
        });

        const variantVehicle = VehicleFitment.normalizeVehicle({ vehicle_id: "QA_VARIANT", maker: "QA", model: "QA", generation: "QA", year_from: "2020-01", year_to: "2022-12", pcd: 100, holes: 4, hub_bore: 54, fastener: "M12×P1.5", oem_inch: "15/17", oem_tire: "195/65R15;215/45R17", variants: [
          { variant_id: "early", label: "前期", year_from: "2020-01", year_to: "2020-12", oem_inch: "15", oem_tire: "195/65R15" },
          { variant_id: "late", label: "後期", year_from: "2021-01", year_to: "2022-12", oem_inch: "17", oem_tire: "215/45R17" }
        ] });
        assert(VehicleFitment.tireSizes(variantVehicle, { year: 2020 }).join() === "195/65R15", "年式で仕様別タイヤサイズを絞り込める");
        assert(VehicleFitment.tireSizes(variantVehicle, { year: 2022, variantId: "late" }).join() === "215/45R17", "仕様選択でタイヤサイズを絞り込める");
      } catch (error) {
        failures += 1;
        lines.push(`FAIL テスト実行エラー: ${error.message}`);
      }
      output.textContent = `${lines.join("\n")}\n\n${failures ? `${failures}件失敗` : "全テスト成功"}`;
      output.className = failures ? "fail" : "pass";
      document.title = failures ? `FAIL (${failures}) VehicleFitment` : "PASS VehicleFitment";
    })();
  </script>
</body>
</html>
